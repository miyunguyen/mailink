services:
  - type: web
    name: mailink-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: MONGODB_URI
        value: mongodb://mailink-mongodb:27017/mailink

  - type: private_service
    name: mailink-mongodb
    runtime: docker
    repo: https://github.com/render-examples/mongodb
    branch: master
    plan: starter

    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 10

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MaiLink</title>
    <link rel="icon" type="image/x-icon" href="./assets/logo.png">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <header>
            <img src="assets/logo.png" class="logo">
            <h1 class="page-title">Mailink - URL Shortener</h1>

        </header>

        <section class="form-section">
            <form class="url-form" hx-post="/api/urls/shorten" hx-target="#shorten-url" hx-swap="innerHTML">
                <div class="form-row">
                    <label for="original_url">
                        <span>Long URL </span> <span class="text-danger"> * </span>
                    </label>
                    <input type="text" id="original_url" name="original_url" placeholder="Paste your URL here" autofocus
                        required>
                </div>

                <div class="form-row">
                    <label for="url">
                        <span>Alias (Optional) </span>
                    </label>

                    <input type="text" id="custom_alias" name="custom_alias" placeholder="Enter Alias here" autofocus>
                </div>

                <div id="shorten-url"></div>

                <button type="submit" class="submit-button"><span>Shorten your link</span></button>
            </form>
        </section>
    </main>

</body>

</html>
